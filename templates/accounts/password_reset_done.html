{% extends 'auth_base.html' %}
{% block title %}Reset Link Sent{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm p-4 text-center">
      <div class="text-success display-4 mb-3"><i class="bi bi-envelope-check"></i></div>
      <h4 class="fw-bold mb-2">Check Your Inbox</h4>
      <p class="text-muted small mb-4">If an account exists with the email you entered, we've sent password reset instructions.</p>
      <a href="{% url 'login' %}" class="btn btn-outline-success">Return to Login</a>
    </div>
  </div>
</div>
{% endblock %}
