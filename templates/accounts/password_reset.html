{% extends 'auth_base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm p-4">
      <h5 class="fw-bold mb-2">Forgot your password?</h5>
      <p class="text-muted small mb-4">Enter your email address below and we'll send you instructions to reset your password.</p>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">Email Address</label>
          {{ form.email }}
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-success fw-semibold">Send Reset Link</button>
        </div>
        <div class="text-center small">
          <a href="{% url 'login' %}" class="text-muted text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
