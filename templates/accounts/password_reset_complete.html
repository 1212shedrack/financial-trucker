{% extends 'auth_base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm p-4 text-center">
      <div class="text-success display-4 mb-3"><i class="bi bi-check-circle"></i></div>
      <h4 class="fw-bold mb-2">Password Reset Successful</h4>
      <p class="text-muted small mb-4">Your password has been reset successfully. You can now log in with your new password.</p>
      <a href="{% url 'login' %}" class="btn btn-success fw-semibold">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
