{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}404 - Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-success mb-2">404</div>
    <h3 class="fw-bold mb-3">Page Not Found</h3>
    <p class="text-muted mb-4">The page you were looking for doesn't exist or has been moved.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-success fw-semibold"><i class="bi bi-house me-1"></i> Back to Dashboard</a>
  </div>
</div>
{% endblock %}
