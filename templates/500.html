{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}
{% block page_title %}500 - Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4">Something went wrong on our end. We're working on fixing it.</p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary fw-semibold"><i class="bi bi-house me-1"></i> Back to Dashboard</a>
  </div>
</div>
{% endblock %}
